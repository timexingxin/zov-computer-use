name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install build dependencies
        run: npm install --no-audit --no-fund

      - name: Lint & privacy check
        run: npm run lint

      - name: Build & typecheck runtime
        run: |
          npm run build
          npm run typecheck

      - name: Run unit, protocol, adversarial & turnkey installer E2E tests
        run: npm test
