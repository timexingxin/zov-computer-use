name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install build dependencies
        run: npm install --no-audit --no-fund

      - name: Lint & privacy check
        run: npm run lint

      - name: Build runtime & native helpers
        run: npm run build

      - name: Typecheck workspace
        run: npm run typecheck

      - name: Run CLI Doctor diagnostics
        run: npm run doctor

      - name: Run unit, protocol, native golden, adversarial & turnkey installer E2E tests
        run: npm test
